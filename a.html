<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Disease Prediction</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-2xl">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">Crop Disease Prediction</h1>
        
        <div class="flex flex-col md:flex-row gap-6 mb-6">
            <!-- File Upload Section -->
            <div class="flex-1 bg-gray-50 p-6 rounded-xl border border-dashed border-gray-300 flex flex-col items-center">
                <h2 class="text-xl font-semibold text-gray-700 mb-4">Upload from File</h2>
                <input type="file" id="file-input" accept="image/*" class="mb-4">
                <button id="predict-file-btn" class="bg-green-500 text-white font-bold py-2 px-6 rounded-full hover:bg-green-600 transition-all duration-300 shadow-lg">
                    Predict
                </button>
            </div>
            
            <!-- Camera Section -->
            <div class="flex-1 bg-gray-50 p-6 rounded-xl border border-dashed border-gray-300 flex flex-col items-center">
                <h2 class="text-xl font-semibold text-gray-700 mb-4">Capture from Camera</h2>
                <video id="webcam-video" autoplay playsinline class="rounded-lg w-full mb-4 shadow-md border border-gray-200 hidden"></video>
                <div class="flex gap-4">
                    <button id="start-cam-btn" class="bg-blue-500 text-white font-bold py-2 px-6 rounded-full hover:bg-blue-600 transition-all duration-300 shadow-lg">
                        Start Camera
                    </button>
                    <button id="capture-btn" class="bg-yellow-500 text-white font-bold py-2 px-6 rounded-full hover:bg-yellow-600 transition-all duration-300 shadow-lg" disabled>
                        Capture
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Displayed Image and Results -->
        <div id="image-container" class="mb-6 flex flex-col items-center">
            <img id="preview-image" src="#" alt="Image Preview" class="hidden max-w-full h-auto rounded-lg shadow-xl border border-gray-200" />
            <canvas id="canvas" class="hidden"></canvas>
        </div>

        <!-- Result Section -->
        <div id="result-box" class="hidden bg-gray-200 p-4 rounded-xl text-center">
            <h3 class="text-lg font-semibold text-gray-800">Prediction:</h3>
            <p id="prediction-text" class="text-2xl font-bold text-green-700 mt-2">N/A</p>
            <h3 class="text-lg font-semibold text-gray-800 mt-4">Confidence:</h3>
            <p id="confidence-text" class="text-xl font-bold text-green-700 mt-2">N/A</p>
        </div>
        
        <!-- Loading Spinner -->
        <div id="loading-spinner" class="flex justify-center hidden mt-4">
            <div class="loading-spinner"></div>
        </div>

        <!-- Message Box -->
        <div id="message-box" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-red-500 text-white p-4 rounded-lg shadow-xl hidden transition-all duration-300 z-50">
            <p id="message-text"></p>
            <button id="close-msg-btn" class="absolute top-1 right-2 text-xl font-bold">&times;</button>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const predictFileBtn = document.getElementById('predict-file-btn');
        const startCamBtn = document.getElementById('start-cam-btn');
        const captureBtn = document.getElementById('capture-btn');
        const webcamVideo = document.getElementById('webcam-video');
        const previewImage = document.getElementById('preview-image');
        const canvas = document.getElementById('canvas');
        const resultBox = document.getElementById('result-box');
        const predictionText = document.getElementById('prediction-text');
        const confidenceText = document.getElementById('confidence-text');
        const messageBox = document.getElementById('message-box');
        const messageText = document.getElementById('message-text');
        const closeMsgBtn = document.getElementById('close-msg-btn');
        const loadingSpinner = document.getElementById('loading-spinner');

        let stream;

        // Function to show a message box
        function showMessage(message, type = 'error') {
            messageText.textContent = message;
            if (type === 'success') {
                messageBox.classList.remove('bg-red-500');
                messageBox.classList.add('bg-green-500');
            } else {
                messageBox.classList.remove('bg-green-500');
                messageBox.classList.add('bg-red-500');
            }
            messageBox.classList.remove('hidden');
        }

        closeMsgBtn.addEventListener('click', () => {
            messageBox.classList.add('hidden');
        });

        // Event listener for file upload
        fileInput.addEventListener('change', () => {
            const file = fileInput.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    previewImage.src = e.target.result;
                    previewImage.classList.remove('hidden');
                    webcamVideo.classList.add('hidden');
                    resultBox.classList.add('hidden');
                    // Stop camera if it's running
                    if (stream) {
                        stream.getTracks().forEach(track => track.stop());
                        stream = null;
                        webcamVideo.srcObject = null;
                        captureBtn.disabled = true;
                    }
                };
                reader.readAsDataURL(file);
            }
        });

        predictFileBtn.addEventListener('click', () => {
            if (fileInput.files.length === 0) {
                showMessage("Please select an image file first.");
                return;
            }
            const file = fileInput.files[0];
            const reader = new FileReader();
            reader.onload = (e) => {
                predictImage(e.target.result);
            };
            reader.readAsDataURL(file);
        });

        // Event listener for starting the camera
        startCamBtn.addEventListener('click', async () => {
            try {
                if (stream) { // If stream is already running, just return
                    return;
                }
                stream = await navigator.mediaDevices.getUserMedia({ video: true });
                webcamVideo.srcObject = stream;
                webcamVideo.classList.remove('hidden');
                previewImage.classList.add('hidden');
                resultBox.classList.add('hidden');
                captureBtn.disabled = false;
            } catch (err) {
                showMessage(`Could not access camera: ${err.message}`);
                captureBtn.disabled = true;
            }
        });

        // Event listener for capturing an image from the camera
        captureBtn.addEventListener('click', () => {
            if (!stream) {
                showMessage("Please start the camera first.");
                return;
            }

            canvas.width = webcamVideo.videoWidth;
            canvas.height = webcamVideo.videoHeight;
            const context = canvas.getContext('2d');
            context.drawImage(webcamVideo, 0, 0, canvas.width, canvas.height);
            const imageDataUrl = canvas.toDataURL('image/png');
            
            previewImage.src = imageDataUrl;
            previewImage.classList.remove('hidden');
            webcamVideo.classList.add('hidden');
            resultBox.classList.add('hidden');

            // Stop the video stream
            stream.getTracks().forEach(track => track.stop());
            stream = null;
            webcamVideo.srcObject = null;
            captureBtn.disabled = true;

            predictImage(imageDataUrl);
        });

        async function predictImage(imageData) {
            loadingSpinner.classList.remove('hidden');
            resultBox.classList.add('hidden');

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: `image=${encodeURIComponent(imageData)}`
                });

                loadingSpinner.classList.add('hidden');

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const result = await response.json();
                
                if (result.error) {
                    showMessage(result.error);
                } else {
                    predictionText.textContent = result.prediction.replace(/__/g, ' ').replace(/_/g, ' ');
                    confidenceText.textContent = result.confidence;
                    resultBox.classList.remove('hidden');
                }

            } catch (error) {
                loadingSpinner.classList.add('hidden');
                showMessage(`Prediction failed: ${error.message}`);
            }
        }
    </script>
</body>
</html>
